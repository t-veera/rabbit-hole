services:
  db:
    image: postgres:16-alpine
    container_name: rabbit-hole-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rabbithole
      POSTGRES_PASSWORD: rabbithole
      POSTGRES_DB: rabbithole
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbithole"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
